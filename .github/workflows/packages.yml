name: Build Linux release packages

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13
            image: debian:13
          - target: deepin25
            image: linuxdeepin/deepin:25
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and validation tools
        run: |
          . /etc/os-release
          case '${{ matrix.target }}' in
            debian13) test "$ID" = debian; test "${VERSION_ID%%.*}" = 13 ;;
            deepin25) test "$ID" = Deepin -o "$ID" = deepin; test "${VERSION_ID%%.*}" = 25 ;;
          esac
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper python3 shellcheck desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source and backend behavior
        run: |
          shellcheck -s sh net.playhi.fast-screen-off/deepin/files/bin/net.playhi.fast-screen-off.sh scripts/*.sh packaging/common/*.sh
          python3 -m unittest discover -s tests -v
          desktop-file-validate net.playhi.fast-screen-off/deepin/entries/applications/net.playhi.fast-screen-off.desktop
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(dpkg-parsechangelog -l net.playhi.fast-screen-off/debian/changelog -S Version)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            printf '::error::Release tag %s does not match package version %s (expected v%s).\n' "$RELEASE_TAG" "$version" "$version"
            exit 1
          fi
      - name: Build package
        run: sh scripts/build-deb.sh '${{ matrix.target }}'
      - name: Validate and install package
        run: |
          python3 scripts/check-deb.py '${{ matrix.target }}' assets/*.deb
          apt-get install -y ./assets/*.deb
          if [ '${{ matrix.target }}' = debian13 ]; then
            fast-screen-off --version
          else
            /opt/apps/net.playhi.fast-screen-off/files/bin/net.playhi.fast-screen-off.sh --version
          fi
          apt-get purge -y net.playhi.fast-screen-off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-screen-off-${{ matrix.target }}
          path: assets/*.deb
          if-no-files-found: error

  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools and helpers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 file patchelf desktop-file-utils x11-xserver-utils libglib2.0-bin libnotify-bin build-essential libwayland-dev pkg-config libkf5screen-bin qt5-qmake qtbase5-dev qtwayland5 libqt5svg5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle helpers and build AppImage
        run: sh scripts/ci-run.sh sh scripts/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-screen-off-appimage
          path: assets/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.kde.Sdk//6.10 org.kde.Platform//6.10
      - name: Build bundle and check helpers inside the sandbox
        run: sh scripts/ci-run.sh dbus-run-session -- sh scripts/build-flatpak.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-screen-off-flatpak
          path: assets/*.flatpak
          if-no-files-found: error

  linglong:
    name: Linglong (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the official Linglong release builder
        run: |
          # Upstream's release repository uses HTTPS but does not provide APT signatures.
          echo 'deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./' | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y linglong-builder linglong-bin linglong-box dbus-x11
          ll-builder --version
      - name: Build UAB and check helpers inside the runtime
        run: sh scripts/ci-run.sh dbus-run-session -- sh scripts/build-linglong.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-screen-off-linglong
          path: assets/*.uab
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, appimage, flatpak, linglong]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fast-screen-off-*
          path: assets
          merge-multiple: true
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"
          version=${RELEASE_TAG#v}
          cd assets
          test -s "net.playhi.fast-screen-off_${version}_debian13_all.deb"
          test -s "net.playhi.fast-screen-off_${version}_deepin25_all.deb"
          test -s "fast-screen-off_${version}_x86_64.AppImage"
          test -s "fast-screen-off_${version}_x86_64.flatpak"
          test -s "fast-screen-off_${version}_x86_64.uab"
          sha256sum ./*.deb ./*.AppImage ./*.flatpak ./*.uab > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -f "$notes_file" ]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "Fast Screen Off $RELEASE_TAG" --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "Fast Screen Off $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" ./*.deb ./*.AppImage ./*.flatpak ./*.uab SHA256SUMS --clobber
          if [ -f "$notes_file" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
